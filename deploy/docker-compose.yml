services:
  tk-platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tk-platform
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - /opt/tk-platform/runtime:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
