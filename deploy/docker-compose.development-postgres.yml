services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vd_nexus
      POSTGRES_USER: vd_nexus
      POSTGRES_PASSWORD: development-only
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vd_nexus"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment:
      TK_DATABASE_URL: postgresql+psycopg://vd_nexus:development-only@postgres:5432/vd_nexus
      TK_DATA_DIR: /data
    depends_on:
      postgres: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn server.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:18082:8000"]
