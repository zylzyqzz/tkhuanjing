name: Phase 1.5 Quality Gate

on:
  pull_request:
  push:
    branches:
      - codex/phase0-phase1-enterprise
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Python and PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vd_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vd_nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TK_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/vd_nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[test]'
      - name: Compile source
        run: python -m compileall -q client_v2 server tests_v2
      - name: Run full Python and PostgreSQL suite
        run: python -m pytest

  admin:
    name: Vue typecheck, unit and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run typecheck
        working-directory: admin
      - run: npm run test:unit
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npx playwright install --with-deps chromium
        working-directory: admin
      - run: npm run test:e2e
        working-directory: admin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: admin/playwright-report
          if-no-files-found: ignore

  container:
    name: Docker build
    needs: [backend, admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci && npm run build
        working-directory: admin
      - run: docker build -f deploy/Dockerfile -t vd-nexus:${{ github.sha }} .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
